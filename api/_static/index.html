<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메이커 사무소 — AI 메이커 팀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🍃</span>
      <div>
        <h1>메이커 사무소</h1>
        <p>말만 하면 만들어드리는 5인 AI 팀</p>
      </div>
    </div>
    <span id="mode-badge" class="badge">connecting…</span>
  </header>

  <main>
    <section id="office-panel">
      <div id="team-board"></div>
      <div class="feed-head">팀 대화</div>
      <div id="activity-log"></div>
    </section>

    <section id="chat-panel">
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="무엇을 만들까요? 예: 테트리스 게임 만들어줘" autocomplete="off" />
        <button type="submit">보내기</button>
      </form>
    </section>
  </main>

  <div id="preview-modal" hidden>
    <div class="pm-box">
      <div class="pm-bar">
        <span id="pm-title">미리보기</span>
        <span class="pm-sp"></span>
        <button id="pm-open">새 탭에서 열기</button>
        <button id="pm-down">다운로드</button>
        <button id="pm-close">닫기</button>
      </div>
      <iframe id="pm-frame" sandbox="allow-scripts"></iframe>
    </div>
  </div>

  <script src="office.js"></script>
  <script src="app.js"></script>
</body>
</html>
